name: Update tree-shaking status

on:
  schedule:
    # Daily at 06:00 UTC. Picks up new rolldown nightly / dependency changes
    # once the lockfile is refreshed by renovate.
    - cron: "0 6 * * *"
  # Manual trigger so the workflow can be tested / forced from the Actions tab.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: pnpm/action-setup@v6 # version is read from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      # Always test the newest published rolldown. `pnpm install` caches the
      # resolution of the "latest" dist-tag, so force a re-resolve each run.
      - name: Update rolldown to latest
        run: pnpm update rolldown --latest

      - name: Build all bundler outputs
        run: pnpm run -r build

      - name: Regenerate status tables
        run: node scripts/update-readme.mjs

      - name: Format
        run: pnpm run format

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update tree-shaking status [skip ci]"
          # Also commit the lockfile so the repo records which rolldown version
          # produced the current status.
          file_pattern: README.md pnpm-lock.yaml
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
